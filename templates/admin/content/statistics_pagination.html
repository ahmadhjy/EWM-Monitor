<nav class="stats-pagination" aria-label="{{ pagination.label }} pagination">
  <span class="stats-pagination-summary">Page {{ pagination.number }}{% if pagination.start %} · Rows {{ pagination.start }}–{{ pagination.end }}{% endif %}</span>
  <div class="stats-pagination-links">
    {% if pagination.first %}<a href="{{ pagination.first }}" aria-label="{{ pagination.label }}: first page">First</a>{% endif %}
    {% if pagination.previous %}<a href="{{ pagination.previous }}" aria-label="{{ pagination.label }}: previous page">Previous</a>{% else %}<span aria-disabled="true">Previous</span>{% endif %}
    {% if pagination.next %}<a href="{{ pagination.next }}" aria-label="{{ pagination.label }}: next page">Next</a>{% else %}<span aria-disabled="true">Next</span>{% endif %}
  </div>
</nav>
