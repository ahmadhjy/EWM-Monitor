include /etc/nginx/snippets/ewm-cloudflare-realip.conf;
upstream ewm_app {
    server unix:/run/ewm/gunicorn.sock fail_timeout=0;
}
limit_req_zone $binary_remote_addr zone=ewm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ewm_public:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name elliottwavemonitor.com www.elliottwavemonitor.com 165.227.156.218;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://elliottwavemonitor.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elliottwavemonitor.com;
    ssl_certificate /etc/letsencrypt/live/elliottwavemonitor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elliottwavemonitor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EWMSSL:10m;
    client_max_body_size 25m;
    server_tokens off;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /var/www/ewm/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location /media/ {
        alias /var/www/ewm/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location = /admin/login/ {
        limit_req zone=ewm_login burst=5 nodelay;
        include /etc/nginx/snippets/ewm-proxy.conf;
    }
    location / {
        limit_req zone=ewm_public burst=50 nodelay;
        include /etc/nginx/snippets/ewm-proxy.conf;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.elliottwavemonitor.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/elliottwavemonitor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elliottwavemonitor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://elliottwavemonitor.com$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 165.227.156.218;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/165.227.156.218/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/165.227.156.218/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://elliottwavemonitor.com$request_uri;
}
